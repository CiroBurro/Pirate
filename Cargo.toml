[package]
name = "pirate"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_bencode = "*"
serde_bytes = "*"
serde_json = "1.0.150"
sha1 = "*"
anyhow = "*"
url = "*"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0.0"
hex = "0.4.3"
ratatui = "0.30.2"
clap = { version = "4.6.1", features = ["derive"] }